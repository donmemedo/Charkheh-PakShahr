services:
  backend:
    build: ./backend
    volumes:
      - sabz-data:/data
    ports:
      - "${API_PORT:-8026}:8000"   # API docs at /docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3026}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sabz-data:
