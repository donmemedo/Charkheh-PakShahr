# Weekly dependency threat brief (scripts/threat_intel.py, threat-intel/README.md). A red run means act:
# an open HIGH/CRITICAL advisory, a CISA KEV match, an expired accepted risk, or OSV unreachable.
name: threat-intel

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threat-intel
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/test_threat_intel.py
      - name: brief (also written to the job summary)
        run: python scripts/threat_intel.py --json threat-intel-brief.json | tee threat-intel-brief.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: threat-intel-brief
          path: threat-intel-brief.*
          retention-days: 90
