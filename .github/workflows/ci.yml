# Every third-party action and tool image is pinned by commit SHA or digest (the comment names the version);
# Dependabot (.github/dependabot.yml) bumps them. PR jobs get no secrets: the tests set their own fake keys.
name: ci

on:
  push:
    branches: [main]
  pull_request:          # never pull_request_target: fork code must not run with a write token or secrets
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"   # weekly: new CVEs land in images and pins that did not change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash          # bash -eo pipefail, not the default bash -e

env:
  COMPOSE_PROJECT_NAME: sabzci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Lock files match the .in pins (Dependabot bumps the .in; the uv line in each lock header relocks)
        run: |
          python - <<'PY'
          import re, sys
          def pins(path):
              return {re.sub(r"[-_.]+", "-", m[1]).lower(): m[2]
                      for m in re.finditer(r"(?m)^([A-Za-z0-9][A-Za-z0-9._-]*)==([^\s;\\]+)", open(path).read())}
          bad = [f"{src}: {n}=={v}" for src, lock in (("requirements.in", "requirements.txt"),
                                                      ("requirements-dev.in", "requirements-dev.txt"))
                 for n, v in pins(src).items() if pins(lock).get(n) != v]
          sys.exit(f"stale lock, rerun the uv pip compile command in its header: {bad}" if bad else 0)
          PY
      - run: python test_api.py
      - run: python ../scripts/test_threat_intel.py
      - name: pip-audit (isolated, hash-checked)
        run: pipx run --spec pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # every commit, not just this push
          persist-credentials: false
      # The gitleaks binary from its pinned image: gitleaks-action scans only the pushed or PR commit range.
      - name: gitleaks over the full history (.gitleaks.toml)
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --no-banner --config /repo/.gitleaks.toml /repo

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep (fails on any finding)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --metrics=off --error --exclude graphify-out
          --config p/python --config p/typescript --config p/react --config p/nextjs
          --config p/secrets --config p/owasp-top-ten

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - run: docker compose --profile ops config -q
      - run: docker compose build
      - name: trivy backend image (HIGH, CRITICAL with a fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sabzci-backend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: trivy frontend image (HIGH, CRITICAL with a fix)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sabzci-frontend:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: CycloneDX SBOM, backend
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sabzci-backend:latest
          format: cyclonedx
          output: sbom-backend.cdx.json
          skip-setup-trivy: true
      - name: CycloneDX SBOM, frontend
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sabzci-frontend:latest
          format: cyclonedx
          output: sbom-frontend.cdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom-cyclonedx
          path: sbom-*.cdx.json
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEMO_MODE: "1"
      WEB_PORT: "3226"
      API_PORT: "8226"
      PROJECT: sabzci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ponytail: rebuilds what the docker job built; pass the images as an artifact if CI minutes matter
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: scripts/smoke.sh full
      - name: compose logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: tear down
        if: always()
        run: docker compose down -v

  gate:
    if: always()
    needs: [backend, frontend, secrets, sast, docker, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
